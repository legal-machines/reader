<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; form-action 'none'; base-uri 'none'">
<title>Check a key</title>
<link rel="stylesheet" href="reader.css">
<link rel="icon" href="data:,">
<script type="module" src="check.mjs"></script>
</head>
<body class="page">
<main class="setup">
  <h1>Is this key yours?</h1>
  <p>A key made for one of our mailboxes waits to be published. Before it is, Seal compares it with the keys kept in this browser. The mail server cannot change this page or its answer, and nothing leaves it.</p>
  <section class="card" id="asked" hidden>
    <h2 id="asked-address"></h2>
    <p class="hint">The key waiting to be published:</p>
    <p class="fingerprint" id="asked-fingerprint"></p>
  </section>
  <section class="verdict" id="verdict" hidden>
    <h2 id="verdict-title"></h2>
    <p id="verdict-text"></p>
  </section>
</main>
</body>
</html>
