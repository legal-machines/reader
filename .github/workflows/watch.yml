# Every 15 minutes, from GitHub's side: that GitHub Pages alone serves the
# Mail Reader (DNS at the registries and deSEC, certificates in the CT logs,
# the files) and that the webmail serves the files it was deployed with
# (watch/expected.json). GitHub mails a failed run to the repository's
# owner, and the mail server's own watch shows it in the webmail.
name: Watch
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check
        run: |
          command -v dig >/dev/null || sudo apt-get install -y -qq bind9-dnsutils
          git clone --quiet --depth 1 "https://github.com/${GITHUB_REPOSITORY}" r
          python3 r/watch/watch.py github r/watch/expected.json
