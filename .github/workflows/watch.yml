# From GitHub's side: that GitHub Pages alone serves the Mail Reader and the
# Web Key Directory (DNS at the registries and deSEC, certificates in the CT
# logs, the files) and that the webmail serves the files it was deployed with
# (watch/expected.json). cron-job.org starts a run every 10 minutes through
# the API, with a token limited to this repository's Actions; the schedule
# here is a fallback, since GitHub starts it only now and then. A run checks
# once and ends; a problem fails it, GitHub mails a failed run to the
# repository's owner, and the mail server's own watch shows it in the webmail.
name: Watch
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check
        run: |
          command -v dig >/dev/null || sudo apt-get install -y -qq bind9-dnsutils
          git clone --quiet --depth 1 "https://github.com/${GITHUB_REPOSITORY}" r
          python3 r/watch/watch.py github r/watch/expected.json
